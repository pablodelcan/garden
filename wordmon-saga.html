<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Wordmon Saga — The Lost Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1a1a2e; --cream:#f8f0d8; --accent:#5b21b6; --accent2:#7c3aed;
  --gold:#d4a548; --green:#22c55e; --red:#ef4444; --text:#2a1f3d; --text2:#6b5d7a;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Nunito',sans-serif;background:#0a0a14;color:var(--text);overflow:hidden;height:100vh;height:100dvh}
#gameRoot{position:relative;width:100%;height:100vh;height:100dvh;max-width:600px;margin:0 auto;background:#000;overflow:hidden}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges}

/* ===== GBA-style HUD chrome ===== */
.gba-box{background:var(--cream);border:3px solid var(--navy);box-shadow:0 0 0 2px var(--cream),3px 3px 0 var(--navy);border-radius:2px}
.px{font-family:'Press Start 2P','Courier New',monospace}

/* HUD top bar */
#hud{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:30}
#hudZone{padding:6px 10px;font-size:.55rem;letter-spacing:.06em;color:var(--navy)}
#hudRight{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.hud-pill{padding:5px 9px;font-size:.5rem;color:var(--navy);display:flex;gap:6px;align-items:center}
.hud-btn{pointer-events:auto;cursor:pointer;padding:7px 10px;font-size:.55rem;color:var(--navy);transition:transform .1s}
.hud-btn:active{transform:translate(2px,2px);box-shadow:0 0 0 2px var(--cream),1px 1px 0 var(--navy)}
#hudBtns{position:absolute;bottom:190px;right:10px;display:flex;flex-direction:column;gap:8px;z-index:30}

/* D-pad */
#dpad{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);display:grid;grid-template:52px 52px 52px/52px 52px 52px;gap:4px;z-index:30}
.dpad-btn{border:3px solid rgba(255,255,255,.35);background:rgba(26,26,46,.55);color:#fff;font-size:1.2rem;cursor:pointer;backdrop-filter:blur(4px);border-radius:10px;display:flex;align-items:center;justify-content:center;user-select:none}
.dpad-btn:active{background:rgba(124,58,237,.6)}
.dpad-a{background:rgba(91,33,182,.7);border-color:#a855f7;font-family:'Press Start 2P',monospace;font-size:.8rem}

/* ===== Dialogue box ===== */
#dlg{display:none;position:absolute;left:10px;right:10px;bottom:184px;z-index:40;padding:13px 14px;min-height:84px;font-family:'Press Start 2P','Courier New',monospace;font-size:.62rem;line-height:1.8;color:var(--navy);letter-spacing:.4px;cursor:pointer}
#dlgName{position:absolute;top:-12px;left:10px;background:var(--navy);color:#fff;padding:3px 10px;font-size:.5rem;letter-spacing:1px;border-radius:3px;font-family:'Press Start 2P',monospace}
#dlgArrow{position:absolute;bottom:6px;right:12px;color:var(--navy);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.tapw{cursor:pointer;border-radius:3px;padding:0 1px}
.tapw:active{background:var(--gold)}

/* ===== Full-screen overlays ===== */
.overlay{display:none;position:absolute;inset:0;z-index:60;background:rgba(10,10,20,.92);overflow-y:auto;padding:14px;backdrop-filter:blur(6px)}
.overlay.open{display:block}
.ov-title{font-family:'Press Start 2P',monospace;font-size:.8rem;color:#fff;text-align:center;margin:10px 0 14px;letter-spacing:.1em;text-shadow:2px 2px 0 var(--navy)}
.ov-close{position:absolute;top:12px;right:12px;z-index:5;background:var(--navy);color:#fff;border:2px solid #fff;padding:7px 12px;font-family:'Press Start 2P',monospace;font-size:.55rem;cursor:pointer;border-radius:3px}
.card{background:var(--cream);border:3px solid var(--navy);border-radius:4px;box-shadow:4px 4px 0 rgba(0,0,0,.5);padding:14px;margin:0 auto 12px;max-width:430px}

/* ===== Battle ===== */
#battle{display:none;position:absolute;inset:0;z-index:50;background:#000;flex-direction:column}
#battle.open{display:flex}
#btlScene{position:relative;flex:1;background-size:cover;background-position:center;min-height:230px;overflow:hidden}
.btl-mon{position:absolute;display:flex;flex-direction:column;align-items:center}
.btl-mon svg,.btl-mon img{width:120px;height:120px;image-rendering:pixelated;filter:drop-shadow(3px 5px 8px rgba(0,0,0,.45))}
#btlPlayer{left:6%;bottom:4%;animation:bobP 2s ease-in-out infinite}
#btlEnemy{right:6%;top:10%;animation:bobE 2s ease-in-out infinite .4s}
@keyframes bobP{50%{transform:translateY(-8px)}}
@keyframes bobE{50%{transform:translateY(-8px)}}
.hpbox{width:150px;background:var(--cream);padding:5px 8px 6px;border:3px solid var(--navy);box-shadow:2px 2px 0 var(--navy);position:absolute;z-index:5}
#hpBoxE{top:10px;left:10px}
#hpBoxP{bottom:10px;right:10px}
.hp-name{font-family:'Press Start 2P',monospace;font-size:.5rem;color:var(--navy);display:flex;justify-content:space-between;margin-bottom:4px;text-transform:uppercase}
.hp-row{display:flex;align-items:center;gap:4px}
.hp-lab{font-family:'Press Start 2P',monospace;font-size:.42rem;color:var(--navy)}
.hp-track{flex:1;height:8px;background:var(--navy);box-shadow:inset 1px 1px 0 rgba(0,0,0,.6)}
.hp-fill{height:100%;background:var(--green);transition:width .5s;box-shadow:inset 0 2px 0 rgba(255,255,255,.45)}
.hp-num{font-family:'Press Start 2P',monospace;font-size:.45rem;color:var(--navy);text-align:right;margin-top:3px}
#btlMsg{background:var(--cream);border-top:4px solid var(--navy);padding:12px 14px;font-family:'Press Start 2P',monospace;font-size:.6rem;line-height:1.8;color:var(--navy);min-height:64px}
#btlActions{background:var(--navy);padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btl-btn{font-family:'Press Start 2P',monospace;font-size:.55rem;padding:13px 8px;background:var(--cream);color:var(--navy);border:3px solid #fff;cursor:pointer;border-radius:3px;line-height:1.5}
.btl-btn:active{transform:translate(1px,1px)}
.btl-btn.gold{background:var(--gold)}
.btl-btn:disabled{opacity:.4;pointer-events:none}
.btl-shake{animation:shake .4s ease}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.btl-flash{animation:hflash .35s ease}
@keyframes hflash{30%{filter:brightness(2.4) saturate(.2)}}

/* ===== Exercise modal ===== */
#exModal{display:none;position:absolute;inset:0;z-index:70;background:rgba(10,10,20,.88);align-items:center;justify-content:center;padding:14px}
#exModal.open{display:flex}
#exCard{background:var(--cream);border:4px solid var(--navy);border-radius:6px;box-shadow:5px 5px 0 rgba(0,0,0,.5);padding:18px 16px;max-width:420px;width:100%;max-height:88vh;overflow-y:auto}
.ex-tag{display:inline-block;font-family:'Press Start 2P',monospace;font-size:.45rem;background:var(--accent);color:#fff;padding:4px 9px;border-radius:3px;letter-spacing:.08em;margin-bottom:10px}
.ex-q{font-family:'Fredoka One',cursive;font-size:1.25rem;color:var(--text);text-align:center;margin:6px 0 14px;line-height:1.5}
.ex-choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ex-btn{font-family:'Fredoka One',cursive;font-size:1.15rem;padding:14px 8px;border:3px solid var(--navy);background:#fff;cursor:pointer;border-radius:6px;color:var(--text);box-shadow:2px 2px 0 var(--navy)}
.ex-btn:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--navy)}
.ex-btn.ok{background:#bbf7d0;border-color:#15803d}
.ex-btn.bad{background:#fecaca;border-color:#b91c1c}
.ex-speaker{display:block;margin:4px auto 10px;font-size:2.4rem;background:none;border:none;cursor:pointer;animation:pulseS 2s ease-in-out infinite}
@keyframes pulseS{50%{transform:scale(1.12)}}
.spell-slots{display:flex;justify-content:center;gap:5px;margin:10px 0;flex-wrap:wrap}
.spell-slot{width:34px;height:42px;border-bottom:4px solid var(--navy);font-family:'Fredoka One',cursive;font-size:1.6rem;text-align:center;line-height:42px;color:var(--text)}
.spell-tiles{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0}
.spell-tile{width:42px;height:48px;font-family:'Fredoka One',cursive;font-size:1.4rem;border:3px solid var(--navy);background:#fff;cursor:pointer;border-radius:6px;box-shadow:2px 2px 0 var(--navy)}
.spell-tile:disabled{opacity:.25}
.passage{background:#fff;border:3px solid var(--accent);border-radius:8px;padding:14px;font-family:'Fredoka One',cursive;font-size:1.05rem;line-height:2.1;text-align:center;color:var(--text);margin-bottom:12px}

/* ===== Quest log / Dex / Bag entries ===== */
.q-item{display:flex;gap:10px;align-items:flex-start;padding:8px 4px;border-bottom:2px dashed rgba(26,26,46,.2);font-size:.85rem;font-weight:700;color:var(--text)}
.q-check{font-size:1rem;flex-shrink:0}
.dex-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dex-cell{background:#fff;border:3px solid var(--navy);border-radius:6px;padding:8px 4px;text-align:center;cursor:pointer}
.dex-cell svg{width:64px;height:64px}
.dex-name{font-family:'Press Start 2P',monospace;font-size:.42rem;color:var(--navy);margin-top:4px;text-transform:uppercase}
.bag-row{display:flex;align-items:center;gap:10px;background:#fff;border:3px solid var(--navy);border-radius:6px;padding:8px 10px;margin-bottom:8px;font-weight:800}
.letters-grid{display:flex;flex-wrap:wrap;gap:5px}
.letter-chip{font-family:'Fredoka One',cursive;font-size:.95rem;background:#fff;border:2px solid var(--navy);border-radius:5px;padding:3px 8px;box-shadow:1px 1px 0 var(--navy)}
.craft-row{background:#fff;border:3px solid var(--navy);border-radius:6px;padding:10px;margin-bottom:10px}
.craft-word{display:flex;gap:4px;margin:6px 0}
.craft-letter{width:30px;height:34px;border:2px solid var(--navy);border-radius:4px;font-family:'Fredoka One',cursive;font-size:1.1rem;display:flex;align-items:center;justify-content:center}
.craft-letter.have{background:#bbf7d0}
.craft-letter.miss{background:#fecaca;opacity:.7}
.craft-btn{font-family:'Press Start 2P',monospace;font-size:.5rem;padding:8px 12px;background:var(--gold);border:3px solid var(--navy);border-radius:4px;cursor:pointer;box-shadow:2px 2px 0 var(--navy)}
.craft-btn:disabled{opacity:.4}

/* ===== Title screen ===== */
#title{position:absolute;inset:0;z-index:90;background:radial-gradient(circle at 50% 30%,#3b1b5a,#0a0a14 75%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
#title h1{font-family:'Press Start 2P',monospace;font-size:1.3rem;color:#fde047;text-shadow:3px 3px 0 #92400e,5px 5px 0 rgba(0,0,0,.5);line-height:1.9;margin-bottom:6px}
#title .sub{font-family:'Press Start 2P',monospace;font-size:.55rem;color:#c4b5fd;letter-spacing:.15em;margin-bottom:26px}
.title-btn{font-family:'Press Start 2P',monospace;font-size:.7rem;padding:15px 26px;background:var(--cream);color:var(--navy);border:3px solid #fff;box-shadow:0 0 0 2px var(--navy),4px 4px 0 rgba(0,0,0,.6);cursor:pointer;border-radius:3px;margin:6px;animation:blink 1.6s steps(2) infinite}
.starter-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.starter-card{background:var(--cream);border:4px solid var(--navy);border-radius:8px;padding:12px;cursor:pointer;width:120px;transition:transform .15s}
.starter-card:hover{transform:translateY(-4px)}
.starter-card svg{width:84px;height:84px}
.starter-name{font-family:'Press Start 2P',monospace;font-size:.5rem;color:var(--navy);margin-top:6px}
.starter-type{font-size:.65rem;font-weight:800;margin-top:3px}

/* Toast */
#toast{position:absolute;top:70px;left:50%;transform:translateX(-50%) translateY(-90px);background:var(--navy);color:#fff;font-family:'Press Start 2P',monospace;font-size:.55rem;padding:10px 16px;border:2px solid #fff;border-radius:4px;z-index:95;transition:transform .4s cubic-bezier(.34,1.56,.64,1);max-width:90%;text-align:center;line-height:1.7}
@media(min-width:500px){#dlg{font-size:.7rem}}
</style>
</head>
<body>
<div id="gameRoot">
  <canvas id="world"></canvas>

  <!-- HUD -->
  <div id="hud">
    <div id="hudZone" class="gba-box px">PAGES VILLAGE</div>
    <div id="hudRight">
      <div class="hud-pill gba-box px">⭐<span id="hudScore">0</span></div>
      <div class="hud-pill gba-box px">🪙<span id="hudCoins">0</span></div>
      <div class="hud-pill gba-box px">📜<span id="hudPages">0</span>/5</div>
    </div>
  </div>
  <div id="hudBtns">
    <div class="hud-btn gba-box px" onclick="UI.openQuest()">📋 QUEST</div>
    <div class="hud-btn gba-box px" onclick="UI.openParty()">👥 TEAM</div>
    <div class="hud-btn gba-box px" onclick="UI.openBag()">🎒 BAG</div>
    <div class="hud-btn gba-box px" onclick="UI.openDex()">📕 DEX</div>
  </div>

  <!-- D-PAD -->
  <div id="dpad">
    <div></div><button class="dpad-btn" data-dir="up">▲</button><div></div>
    <button class="dpad-btn" data-dir="left">◀</button><button class="dpad-btn dpad-a" data-dir="action">A</button><button class="dpad-btn" data-dir="right">▶</button>
    <div></div><button class="dpad-btn" data-dir="down">▼</button><div></div>
  </div>

  <!-- DIALOGUE -->
  <div id="dlg" class="gba-box">
    <div id="dlgName"></div>
    <div id="dlgText"></div>
    <div id="dlgArrow" style="display:none">▼</div>
  </div>

  <!-- BATTLE -->
  <div id="battle">
    <div id="btlScene">
      <div class="hpbox" id="hpBoxE">
        <div class="hp-name"><span id="eName">?</span><span id="eLv">:L1</span></div>
        <div class="hp-row"><span class="hp-lab">HP</span><div class="hp-track"><div class="hp-fill" id="eHp" style="width:100%"></div></div></div>
        <div class="hp-num" id="eHpN"></div>
      </div>
      <div class="hpbox" id="hpBoxP">
        <div class="hp-name"><span id="pName">?</span><span id="pLv">:L1</span></div>
        <div class="hp-row"><span class="hp-lab">HP</span><div class="hp-track"><div class="hp-fill" id="pHp" style="width:100%"></div></div></div>
        <div class="hp-num" id="pHpN"></div>
      </div>
      <div class="btl-mon" id="btlEnemy"></div>
      <div class="btl-mon" id="btlPlayer"></div>
    </div>
    <div id="btlMsg" class="px">A wild Wordmon appears!</div>
    <div id="btlActions"></div>
  </div>

  <!-- EXERCISE MODAL -->
  <div id="exModal"><div id="exCard"></div></div>

  <!-- GENERIC OVERLAYS -->
  <div class="overlay" id="ovQuest"><button class="ov-close px" onclick="UI.close('ovQuest')">✕</button><div class="ov-title">QUEST LOG</div><div id="questBody"></div></div>
  <div class="overlay" id="ovParty"><button class="ov-close px" onclick="UI.close('ovParty')">✕</button><div class="ov-title">YOUR TEAM</div><div id="partyBody"></div></div>
  <div class="overlay" id="ovBag"><button class="ov-close px" onclick="UI.close('ovBag')">✕</button><div class="ov-title">BAG</div><div id="bagBody"></div></div>
  <div class="overlay" id="ovDex"><button class="ov-close px" onclick="UI.close('ovDex')">✕</button><div class="ov-title">WORDMON DEX</div><div id="dexBody"></div></div>
  <div class="overlay" id="ovCraft"><button class="ov-close px" onclick="UI.close('ovCraft')">✕</button><div class="ov-title">CRAFTING TABLE</div><div id="craftBody"></div></div>
  <div class="overlay" id="ovStory"><div id="storyBody"></div></div>

  <!-- TOAST -->
  <div id="toast"></div>

  <!-- TITLE -->
  <div id="title">
    <h1>WORDMON SAGA</h1>
    <div class="sub">THE LOST LIBRARY</div>
    <div id="titleBody">
      <div style="font-size:3.5rem;margin-bottom:10px">📖✨</div>
      <button class="title-btn" onclick="G.titleStart()">▶ PRESS START</button>
      <div id="titleHint" style="font-family:'Press Start 2P',monospace;font-size:.45rem;color:#8b7aa8;margin-top:18px;line-height:2">A READING ADVENTURE<br>FOR RÍO</div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
// ============================================================
// WORDMON SAGA — The Lost Library
// A Pokemon × Minecraft reading RPG for Río.
// Story: The Silence stole the 5 Lost Pages of the Great
// Library. Words are fading from the world. Río and his
// Wordmon partner travel 6 zones to recover them.
// ============================================================

// ---------- SFX (compact WebAudio) ----------
const SFX={ctx:null,init(){if(!this.ctx)this.ctx=new(window.AudioContext||window.webkitAudioContext)();if(this.ctx.state==='suspended')this.ctx.resume();},
play(t){try{this.init();const c=this.ctx,n=c.currentTime;const tone=(f0,f1,dur,type,vol,at)=>{const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type=type||'sine';o.frequency.setValueAtTime(f0,n+(at||0));if(f1)o.frequency.exponentialRampToValueAtTime(f1,n+(at||0)+dur);g.gain.setValueAtTime(vol||.2,n+(at||0));g.gain.exponentialRampToValueAtTime(.001,n+(at||0)+dur);o.start(n+(at||0));o.stop(n+(at||0)+dur+.02);};
switch(t){
case'correct':[523,659,784].forEach((f,i)=>tone(f,0,.3,'sine',.25,i*.08));break;
case'wrong':tone(200,150,.3,'square',.18);break;
case'click':tone(800,0,.06,'sine',.1);break;
case'blip':tone(660+Math.random()*80,0,.04,'square',.04);break;
case'step':tone(220,180,.05,'sine',.04);break;
case'attack':tone(360,60,.18,'sawtooth',.25);tone(110,35,.18,'sine',.35);break;
case'hurt':tone(480,80,.3,'sawtooth',.2);break;
case'faint':tone(600,150,.6,'sine',.25);break;
case'catch':[660,880,1100,1320,1100,1320].forEach((f,i)=>tone(f,0,.15,'sine',.18,i*.08));break;
case'fanfare':[392,494,587,784,988,1175].forEach((f,i)=>tone(f,0,.3,'triangle',.2,i*.09));break;
case'mine':tone(150,80,.12,'square',.25);tone(2200,1100,.1,'triangle',.08);break;
case'craft':[523,659,784,1047].forEach((f,i)=>tone(f,0,.25,'triangle',.2,i*.1));break;
case'levelup':[392,494,587,784,988].forEach((f,i)=>tone(f,0,.25,'sine',.25,i*.1));break;
case'page':[784,988,1175,1568].forEach((f,i)=>tone(f,0,.4,'sine',.2,i*.12));break;
case'whoosh':tone(400,1200,.14,'sine',.1);break;
}}catch(e){}}};

// ---------- Voice ----------
let _voice=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices();if(!vs.length)return null;const pref=['Samantha','Karen','Google US English','Moira','Daniel'];for(const p of pref){const v=vs.find(v=>v.name.includes(p));if(v)return v;}return vs.find(v=>v.lang.startsWith('en'))||vs[0];}catch(e){return null;}}
if(window.speechSynthesis){speechSynthesis.onvoiceschanged=()=>{_voice=pickVoice();};_voice=pickVoice();}
function speak(text,rate,onEnd){if(!window.speechSynthesis){if(onEnd)onEnd();return;}try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text.replace(/[♥★✦📜🪙⭐]/g,''));u.rate=rate||0.82;u.pitch=1.1;if(!_voice)_voice=pickVoice();if(_voice)u.voice=_voice;if(onEnd)u.onend=onEnd;speechSynthesis.speak(u);}catch(e){if(onEnd)onEnd();}}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

// ============================================================
// CREATURES — the Saga's own roster (word-themed)
// ============================================================
function monSvg(body,extra){return '<svg viewBox="0 0 100 100">'+body+(extra||'')+'</svg>';}
const EYES='<circle cx="42" cy="46" r="5" fill="#1e293b"/><circle cx="58" cy="46" r="5" fill="#1e293b"/><circle cx="43.5" cy="44.5" r="2" fill="#fff"/><circle cx="59.5" cy="44.5" r="2" fill="#fff"/>';
const SMILE='<path d="M44 58 Q50 63 56 58" stroke="#1e293b" stroke-width="2.5" fill="none" stroke-linecap="round"/>';
const MONS=[
{id:'inklet',type:'Ink',color:'#475569',names:['Inklet','Quillon','Scriptyrant'],hp:[34,50,72],
 bio:'A tiny drop of living ink. It writes its feelings in the air!',

const EX={
 open(html){const m=document.getElementById('exModal');document.getElementById('exCard').innerHTML=html;m.classList.add('open');},
 close(){document.getElementById('exModal').classList.remove('open');},
 // Main entry: pick exercise by reading level
 ask(kind){
  const lv=G.level();
  if(kind==='spell')return this.spellIt();
  if(kind==='passage')return this.passage();
  if(lv===1)return Math.random()<.5?this.wordMatch():this.pictureMatch();
  if(lv===2)return Math.random()<.5?this.fillBlank():this.wordMatch();
  if(lv===3)return Math.random()<.5?this.spellIt():this.fillBlank();
  return Math.random()<.5?this.passage():this.spellIt();
 },
 _choices(correctLabel,wrongLabels,onPick,prefix){
  const opts=shuffle([{l:correctLabel,ok:true},...wrongLabels.map(l=>({l,ok:false}))]);
  return {html:'<div class="ex-choices">'+opts.map((o,i)=>'<button class="ex-btn" data-ok="'+o.ok+'" data-i="'+i+'">'+(prefix?prefix(o.l):o.l)+'</button>').join('')+'</div>',
   wire:(resolve)=>{document.querySelectorAll('#exCard .ex-btn').forEach(b=>{b.addEventListener('click',()=>{
    const ok=b.dataset.ok==='true';
    document.querySelectorAll('#exCard .ex-btn').forEach(x=>{x.style.pointerEvents='none';if(x.dataset.ok==='true')x.classList.add('ok');});
    if(ok){b.classList.add('ok');SFX.play('correct');G.totalCorrect++;G.score+=5;G.updateHUD();}
    else{b.classList.add('bad');SFX.play('wrong');}
    setTimeout(()=>{this.close();resolve(ok);},ok?800:1500);
   });});}};
 },
 wordMatch(){ // hear the word, tap it
  return new Promise(res=>{
   const t=W1[Math.floor(Math.random()*W1.length)];
   const wrongs=shuffle(W1.filter(x=>x.w!==t.w)).slice(0,3).map(x=>x.w);
   const c=this._choices(t.w,wrongs);
   this.open('<div class="ex-tag">🎧 HEAR IT</div><button class="ex-speaker" onclick="speak(\''+t.w+'\',0.7)">🔊</button><div class="ex-q">Tap the word you hear!</div>'+c.html);
   c.wire(res);speak("Tap the word... "+t.w,0.72);
  });
 },
 pictureMatch(){ // see picture, tap the word
  return new Promise(res=>{
   const t=W1[Math.floor(Math.random()*W1.length)];
   const wrongs=shuffle(W1.filter(x=>x.w!==t.w)).slice(0,3).map(x=>x.w);
   const c=this._choices(t.w,wrongs);
   this.open('<div class="ex-tag">👀 READ IT</div><div style="text-align:center;font-size:4rem;margin:6px 0">'+t.e+'</div><div class="ex-q">Which word matches?</div>'+c.html);
   c.wire(res);speak("Which word matches the picture?");
  });
 },
 fillBlank(){
  return new Promise(res=>{
   const t=W2[Math.floor(Math.random()*W2.length)];
   const c=this._choices(t.a,t.d);
   this.open('<div class="ex-tag">✏️ FILL THE BLANK</div><div class="ex-q">'+t.s.replace('___','<span style="color:var(--accent);border-bottom:4px solid var(--accent);padding:0 8px">___</span>')+'</div>'+c.html);
   c.wire(res);speak(t.s.replace('___','blank'));
  });
 },
 spellIt(){
  return new Promise(res=>{
   const w=W3[Math.floor(Math.random()*W3.length)].toUpperCase();
   const extra=[];const AL='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
   while(extra.length<3){const l=AL[Math.floor(Math.random()*26)];if(!w.includes(l)&&!extra.includes(l))extra.push(l);}
   const tiles=shuffle([...w.split(''),...extra]);
   let built='';
   this.open('<div class="ex-tag">🔤 SPELL IT</div><button class="ex-speaker" onclick="speak(\''+w.toLowerCase()+'\',0.65)">🔊</button><div class="ex-q">Spell the word you hear!</div>'+
    '<div class="spell-slots">'+w.split('').map((_,i)=>'<div class="spell-slot" id="sl'+i+'"></div>').join('')+'</div>'+
    '<div class="spell-tiles">'+tiles.map((l,i)=>'<button class="spell-tile" data-l="'+l+'" id="tl'+i+'">'+l+'</button>').join('')+'</div>');
   speak("Spell the word... "+w.toLowerCase(),0.68);
   document.querySelectorAll('.spell-tile').forEach(b=>{b.addEventListener('click',()=>{
    if(built.length>=w.length)return;
    SFX.play('click');b.disabled=true;
    document.getElementById('sl'+built.length).textContent=b.dataset.l;
    built+=b.dataset.l;
    if(built.length===w.length){
     const ok=built===w;
     if(ok){SFX.play('correct');G.totalCorrect++;G.score+=8;G.updateHUD();}
     else{SFX.play('wrong');for(let i=0;i<w.length;i++){const s=document.getElementById('sl'+i);s.textContent=w[i];s.style.color='#15803d';}speak("It spells "+w.toLowerCase());}
     setTimeout(()=>{this.close();res(ok);},ok?800:2000);
    }
   });});
  });
 },
 passage(){
  return new Promise(res=>{
   const t=W4[Math.floor(Math.random()*W4.length)];
   const c=this._choices(t.a,t.d);
   this.open('<div class="ex-tag">📖 READ &amp; ANSWER</div><div class="passage">'+t.p+'</div><div class="ex-q">'+t.q+'</div>'+c.html);
   c.wire(res);speak(t.p+' ... '+t.q,0.85);
  });
 },
 // mining scramble: tap letters in order to spell the shown word
 mine(){
  return new Promise(res=>{
   const w=MINE_WORDS[Math.floor(Math.random()*MINE_WORDS.length)];
   const tiles=shuffle(w.split('').map((l,i)=>({l,i})));
   let next=0;
   this.open('<div class="ex-tag">⛏️ MINE THE WORD</div><div class="ex-q">Tap the letters in order:<br><span style="font-family:\'Press Start 2P\',monospace;font-size:1.1rem;letter-spacing:.3em;color:var(--accent)">'+w+'</span></div>'+

    '<div style="text-align:center;font-size:.75rem;color:var(--text2);font-weight:700;margin-top:6px">Crack the ore by spelling!</div>');
   speak("Mine the word! Tap the letters in order: "+w.split('').join(', '),0.8);
   document.querySelectorAll('#exCard .spell-tile').forEach(b=>{b.addEventListener('click',()=>{
    if(parseInt(b.dataset.i)===next){

 next(){
  if(this.timer){clearInterval(this.timer);this.timer=null;
   // skip typing → show full
   this.renderFull();return;}
  if(!this.queue.length){this.close();return;}
  const text=this.queue.shift();this.fullText=text;
  const el=document.getElementById('dlgText');el.textContent='';
  document.getElementById('dlgArrow').style.display='none';
  speak(text);
  let i=0;
  this.timer=setInterval(()=>{
   if(i>=text.length){clearInterval(this.timer);this.timer=null;this.renderFull();return;}
   el.textContent+=text[i];if(i%3===0)SFX.play('blip');i++;
  },26);
 },
 renderFull(){
  const el=document.getElementById('dlgText');
  el.innerHTML=this.fullText.split(/(\s+)/).map(w=>{const c=w.trim();return c?'<span class="tapw" onclick="event.stopPropagation();speak(\''+c.replace(/[^a-zA-Z0-9¡!¿?.,'-]/g,'')+'\',0.7)">'+w+'</span>':w;}).join('');
  document.getElementById('dlgArrow').style.display='block';
 },
 close(){
  this.open=false;
  document.getElementById('dlg').style.display='none';
  try{speechSynthesis.cancel();}catch(e){}
  if(this.onDone){const f=this.onDone;this.onDone=null;f();}
 }};

 active:false,enemy:null,eHp:0,eMax:0,busy:false,isBoss:false,

  if(ok){
   const dmg=(kind==='spell'?10:6)+G.level()*2+Math.floor(Math.random()*4);

   setTimeout(()=>this.enemyTurn(),900);
  }
 },
 usePotion(){

 village:{bg:0x8ed1f5,fogC:0x8ed1f5,fogN:14,fogF:34,ground:'grass',hemi:1.0,dir:0.75},
 woods:  {bg:0x9fd48f,fogC:0x9fd48f,fogN:11,fogF:26,ground:'grass',hemi:0.95,dir:0.7},
 cave:   {bg:0x0b1020,fogC:0x0b1020,fogN:7,fogF:18,ground:'stone',hemi:0.5,dir:0.25},
 desert: {bg:0xffe3ae,fogC:0xffe3ae,fogN:13,fogF:30,ground:'sand',hemi:1.05,dir:0.85},
 peaks:  {bg:0xe8f4ff,fogC:0xe8f4ff,fogN:11,fogF:26,ground:'snow',hemi:1.0,dir:0.8},
 citadel:{bg:0x140a26,fogC:0x1c1133,fogN:8,fogF:22,ground:'obsidian',hemi:0.55,dir:0.3}};

const WORLD={
 minedTiles:{},moving:false,anim:0,
 renderer:null,scene:null,camera:null,zoneGroup:null,
 mats:{},sprMats:{},playerSprite:null,partnerSprite:null,partnerKey:'',
 npcSprites:[],particles:[],bossMat:null,caveLight:null,hemi:null,dir:null,
 pDisp:{x:0,z:0},_texLoader:null,

 init(){
  const canvas=document.getElementById('world');
  this.renderer=new THREE.WebGLRenderer({canvas,antialias:false});
  this.renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
  this.scene=new THREE.Scene();
  this.camera=new THREE.PerspectiveCamera(55,1,0.1,120);
  this._texLoader=new THREE.TextureLoader();
  // lights
  this.hemi=new THREE.HemisphereLight(0xffffff,0x667744,1.0);
  this.scene.add(this.hemi);
  this.dir=new THREE.DirectionalLight(0xfff2dd,0.75);
  this.dir.position.set(6,12,4);
  this.scene.add(this.dir);
  this.caveLight=new THREE.PointLight(0xffcf78,0,7);
  this.scene.add(this.caveLight);
  // block materials — Minecraft-style textures, nearest-filtered
  const M=(key,file,color,opts)=>{
   const mat=new THREE.MeshLambertMaterial(Object.assign({color:0xffffff},opts||{}));
   const t=this._texLoader.load('sprites/'+file+'.png',undefined,undefined,()=>{mat.map=null;mat.color.set(color);mat.needsUpdate=true;});
   t.magFilter=THREE.NearestFilter;t.minFilter=THREE.NearestFilter;t.generateMipmaps=false;
   mat.map=t;this.mats[key]=mat;return mat;};
  M('grass_side','mc_grass_side',0x7bb544);
  M('grass_top','mc_grass_top',0x86c94e);
  M('dirt','mc_dirt',0x8a5a33);
  M('path','mc_path_top',0xc9a96e);
  M('stone','mc_stone',0x8a8a8a);
  M('ore','mc_ore',0x3b82f6);
  M('log','mc_log_side',0x6b4a2a);
  M('leaves','mc_leaves',0x2f8f3c);
  M('sand','mc_sand',0xe8d49a);
  M('snow','mc_snow',0xf4f8ff);
  M('ice','mc_ice',0xa8d8ea);
  M('water','mc_water',0x2563eb,{transparent:true,opacity:0.85});
  M('obsidian','mc_obsidian',0x17101f);
  M('void','mc_void',0x2a1a4a);
  M('cosmic','mc_cosmic',0x312e81);
  M('lava','mc_lava',0xff4500);
  M('plank','mc_plank',0xb88a55);
  M('bookshelf','mc_bookshelf',0x9a6b3f);
  // cross-plane tuft materials (alpha-cut)
  const T=(key,file)=>{const mat=new THREE.MeshLambertMaterial({transparent:true,alphaTest:0.35,side:THREE.DoubleSide});const t=this._texLoader.load('sprites/'+file+'.png');t.magFilter=THREE.NearestFilter;t.minFilter=THREE.NearestFilter;t.generateMipmaps=false;mat.map=t;this.mats[key]=mat;};
  T('tuft','mc_tuft_grass');T('flowerR','mc_tuft_flower_red');T('flowerY','mc_tuft_flower_yellow');
  // billboard sprite materials
  const S=(key,file)=>{const t=this._texLoader.load('sprites/'+file+'.png');t.magFilter=THREE.NearestFilter;t.minFilter=THREE.NearestFilter;this.sprMats[key]=new THREE.SpriteMaterial({map:t,transparent:true});};
  ['down','up','left','right'].forEach(d=>S('rio_'+d,'rio_'+d));
  S('house','tile_house');S('center','tile_pokecenter');S('shop','tile_shop');S('library','tile_library');
  S('npc_prof','npc_prof');S('npc_kid','npc_kid');S('npc_rosa','npc_rosa');S('npc_milo','npc_milo');
  this.sprMats.lock=this.emojiMat('🔒');this.sprMats.door=this.emojiMat('🚪');
  this.sprMats.hint=this.emojiMat('❗');this.sprMats.sparkle=this.emojiMat('✨');
  // player + partner billboards
  this.playerSprite=new THREE.Sprite(this.sprMats.rio_down);
  this.playerSprite.scale.set(1.35,1.35,1);
  this.scene.add(this.playerSprite);
  this.partnerSprite=new THREE.Sprite(new THREE.SpriteMaterial({transparent:true,opacity:0}));
  this.partnerSprite.scale.set(1.0,1.0,1);
  this.scene.add(this.partnerSprite);
  this.pDisp={x:G.px,z:G.py};
  this.buildZone();
  this.resize();window.addEventListener('resize',()=>this.resize());
  // D-pad
  document.querySelectorAll('.dpad-btn').forEach(b=>{
   const dir=b.dataset.dir;let iv=null;
   const go=()=>{if(dir==='action')this.interact();else this.tryMove(dir);};
   b.addEventListener('touchstart',e=>{e.preventDefault();go();iv=setInterval(go,210);});
   b.addEventListener('touchend',()=>clearInterval(iv));
   b.addEventListener('mousedown',()=>{go();iv=setInterval(go,210);});
   b.addEventListener('mouseup',()=>clearInterval(iv));
   b.addEventListener('mouseleave',()=>clearInterval(iv));
  });
  // keyboard
  document.addEventListener('keydown',e=>{
   if(!G.started||BATTLE.active||document.querySelector('.overlay.open')||document.getElementById('exModal').classList.contains('open'))return;
   if(DLG.open){if(e.key==='Enter'||e.key===' '||e.key==='z')DLG.next();return;}
   const km={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'};
   if(km[e.key])this.tryMove(km[e.key]);
   if(e.key==='Enter'||e.key===' '||e.key==='z')this.interact();
  });
  // tap-to-interact (mine ore / talk / step)
  canvas.addEventListener('pointerdown',e=>this.tap(e));
  this.loop();
 },
 emojiMat(ch){const cv=document.createElement('canvas');cv.width=cv.height=128;const c=cv.getContext('2d');c.font='100px serif';c.textAlign='center';c.textBaseline='middle';c.fillText(ch,64,72);const t=new THREE.CanvasTexture(cv);return new THREE.SpriteMaterial({map:t,transparent:true});},
 svgMat(svg){
  // SVG-as-image requires the xmlns attribute (inline HTML does not)
  const x=svg.includes('xmlns')?svg:svg.replace('<svg ','<svg xmlns="http://www.w3.org/2000/svg" ');
  const img=new Image();const cv=document.createElement('canvas');cv.width=cv.height=256;
  const mat=new THREE.SpriteMaterial({transparent:true,opacity:0});
  img.onload=()=>{cv.getContext('2d').drawImage(img,0,0,256,256);mat.map=new THREE.CanvasTexture(cv);mat.opacity=1;mat.needsUpdate=true;};
  img.src='data:image/svg+xml;base64,'+btoa(unescape(encodeURIComponent(x)));
  return mat;
 },
 resize(){const w=Math.min(window.innerWidth,600),h=window.innerHeight;this.renderer.setSize(w,h);this.camera.aspect=w/h;this.camera.updateProjectionMatrix();},
 mapData(){return MAPS[G.map];},
 tileAt(x,y){const m=this.mapData();if(x<0||y<0||x>=m.w||y>=m.h)return 4;if(this.minedTiles[G.map+':'+x+','+y])return 0;return m.data[y*m.w+x];},

 // ---------- zone construction ----------
 buildZone(){
  if(this.zoneGroup)this.scene.remove(this.zoneGroup);
  this.zoneGroup=new THREE.Group();
  this.npcSprites=[];
  const m=this.mapData(),z=ZONES3D[m.zone]||ZONES3D.village;
  this.scene.background=new THREE.Color(z.bg);
  this.scene.fog=new THREE.Fog(z.fogC,z.fogN,z.fogF);
  this.hemi.intensity=z.hemi;this.dir.intensity=z.dir;
  this.caveLight.intensity=(m.zone==='cave')?1.5:(m.zone==='citadel'?0.9:0);
  const batch={};
  const box=(key,x,y,zz,sx,sy,sz)=>{const mtx=new THREE.Matrix4().compose(new THREE.Vector3(x,y,zz),new THREE.Quaternion(),new THREE.Vector3(sx||1,sy||1,sz||1));(batch[key]=batch[key]||[]).push(mtx);};
  const topPlane=(key,x,y,zz)=>{const q=new THREE.Quaternion().setFromEuler(new THREE.Euler(-Math.PI/2,0,0));const mtx=new THREE.Matrix4().compose(new THREE.Vector3(x,y,zz),q,new THREE.Vector3(1,1,1));(batch['P:'+key]=batch['P:'+key]||[]).push(mtx);};
  const groundBox=(x,zz)=>{if(z.ground==='grass'){box('grass_side',x,0,zz);topPlane('grass_top',x,0.501,zz);}else box(z.ground,x,0,zz);};
  const tree=(x,zz)=>{
   if(m.zone==='cave'){box('stone',x,1,zz);box('stone',x,2,zz);return;}
   if(m.zone==='citadel'){box('obsidian',x,1,zz);box('obsidian',x,2,zz);return;}
   box('log',x,1,zz);box('log',x,2,zz);
   for(let dx=-1;dx<=1;dx++)for(let dz=-1;dz<=1;dz++){box('leaves',x+dx,3,zz+dz);if(Math.abs(dx)+Math.abs(dz)<2)box('leaves',x+dx,4,zz+dz);}
   if(m.zone==='peaks')topPlane('snow',x,4.501,zz);
  };
  const cross=(key,x,zz,s)=>{
   const g=new THREE.PlaneGeometry(s,s);
   for(const rot of [0,Math.PI/2]){const p=new THREE.Mesh(g,this.mats[key]);p.position.set(x,s/2+0.5,zz);p.rotation.y=rot;this.zoneGroup.add(p);}
  };
  const bb=(key,x,zz,scale)=>{const s=new THREE.Sprite(this.sprMats[key]);s.scale.set(scale,scale,1);s.position.set(x,0.5+scale/2-0.14,zz);this.zoneGroup.add(s);return s;};
  for(let y=0;y<m.h;y++)for(let x=0;x<m.w;x++){
   const t=this.tileAt(x,y),zz=y;
   if(t===3){box('water',x,-0.12,zz,1,0.76,1);continue;}
   if(t===11){box('lava',x,-0.12,zz,1,0.76,1);continue;}
   if(t===20){box('sand',x,0,zz);continue;}
   if(t===12){box('ice',x,0,zz);continue;}
   if(t===13){box('void',x,0,zz);continue;}
   if(t===14){box('cosmic',x,0,zz);continue;}
   if(t===1){box('path',x,0,zz);continue;}
   groundBox(x,zz);
   if(t===2)cross('tuft',x,zz,0.95);
   else if(t===17)cross('flowerR',x,zz,0.72);
   else if(t===18)cross('flowerY',x,zz,0.72);
   else if(t===4)tree(x,zz);
   else if(t===19)box('stone',x,1,zz);
   else if(t===10){box('ore',x,1,zz);const sp=new THREE.Sprite(this.sprMats.sparkle);sp.scale.set(0.5,0.5,1);sp.position.set(x,1.9,zz);sp.userData.spark=true;this.zoneGroup.add(sp);}
   else if(t===5)bb('house',x,zz,2.2);
   else if(t===6)bb('center',x,zz,2.4);
   else if(t===7)bb('shop',x,zz,2.4);
   else if(t===16){bb('library',x,zz,2.6);box('bookshelf',x,1,zz,0.96,0.96,0.96);}
   else if(t===8){
    const post=new THREE.Mesh(new THREE.BoxGeometry(0.12,0.55,0.12),this.mats.log);post.position.set(x,0.78,zz);this.zoneGroup.add(post);
    const brd=new THREE.Mesh(new THREE.BoxGeometry(0.74,0.46,0.08),this.mats.plank);brd.position.set(x,1.12,zz);this.zoneGroup.add(brd);}
   else if(t===9){
    const post=new THREE.Mesh(new THREE.BoxGeometry(0.16,0.85,0.16),this.mats.log);post.position.set(x,0.92,zz);this.zoneGroup.add(post);
    const r1=new THREE.Mesh(new THREE.BoxGeometry(1.0,0.09,0.07),this.mats.plank);r1.position.set(x,1.06,zz);this.zoneGroup.add(r1);
    const r2=r1.clone();r2.position.y=0.8;this.zoneGroup.add(r2);}
  }
  // flush instanced geometry
  const unitBox=new THREE.BoxGeometry(1,1,1);
  const unitPlane=new THREE.PlaneGeometry(1,1);
  for(const key in batch){
   const isPlane=key.startsWith('P:');
   const arr=batch[key];
   const im=new THREE.InstancedMesh(isPlane?unitPlane:unitBox,this.mats[isPlane?key.slice(2):key],arr.length);
   arr.forEach((mtx,i)=>im.setMatrixAt(i,mtx));
   im.instanceMatrix.needsUpdate=true;
   this.zoneGroup.add(im);
  }
  // gate markers
  (m.exits||[]).forEach(e=>{if(!e.gate)return;const s=new THREE.Sprite(e.gate.item?this.sprMats.lock:this.sprMats.door);s.scale.set(0.8,0.8,1);s.position.set(e.x,1.25,e.y);this.zoneGroup.add(s);});
  // NPC billboards + ❗ hints
  (m.npcs||[]).forEach(n=>{
   let s;
   if(n.boss){if(!this.bossMat)this.bossMat=this.svgMat(BOSS.svgs[0]);s=new THREE.Sprite(this.bossMat);const sz=G.flags.bossDown?1.0:2.3;s.scale.set(sz,sz,1);}
   else{s=new THREE.Sprite(this.sprMats[n.sprite]||this.sprMats.npc_kid);s.scale.set(1.3,1.3,1);}
   s.position.set(n.x,0.5+s.scale.y/2-0.1,n.y);
   s.userData.npc=n;
   this.zoneGroup.add(s);this.npcSprites.push(s);
   const hint=new THREE.Sprite(this.sprMats.hint);hint.scale.set(0.42,0.42,1);
   hint.userData.baseY=0.55+s.scale.y+0.3;
   hint.position.set(n.x,hint.userData.baseY,n.y);
   hint.userData.hint=true;this.zoneGroup.add(hint);
  });
  this.scene.add(this.zoneGroup);
 },

 // ---------- movement (same grid rules as the 2D engine) ----------
 tryMove(dir){
  if(this.moving||DLG.open||BATTLE.active)return;
  G.facing=dir;
  const dx={left:-1,right:1,up:0,down:0}[dir],dy={left:0,right:0,up:-1,down:1}[dir];
  const nx=G.px+dx,ny=G.py+dy;
  const m=this.mapData();
  const ex=(m.exits||[]).find(e=>e.x===nx&&e.y===ny);
  if(ex){
   if(ex.gate){
    const g=ex.gate;
    if(g.item&&!G.items.includes(g.item)){DLG.show('GATE',[g.msg]);return;}
    if(g.pages&&G.pages.length<g.pages){DLG.show('GATE',[g.msg]);return;}
    if(g.read&&!G.flags['gate_'+ex.to]){
     DLG.show('STONE DOOR',[g.msg,"Answer the door's riddle to pass!"],async()=>{
      const ok=await EX.ask();
      if(ok){G.flags['gate_'+ex.to]=true;G.toast('The door rumbles open!');SFX.play('page');this.travel(ex);}
      else G.toast('The door stays shut. Try again!');
     });
     return;
    }
   }
   this.travel(ex);return;
  }
  const t=this.tileAt(nx,ny);
  if(t===10){this.mineAt(nx,ny);return;}
  if(SOLID.includes(t))return;
  G.px=nx;G.py=ny;this.moving=true;SFX.play('step');
  setTimeout(()=>{this.moving=false;},130);
  if(t===2&&m.encounterRate&&Math.random()<m.encounterRate){
   setTimeout(()=>BATTLE.start(null,false),260);
  }
  G.save();
 },
 mineAt(nx,ny){
  EX.mine().then(word=>{
   G.addLetters(word);
   G.flags.mined=(G.flags.mined||0)+1;
   G.coins+=2;
   this.minedTiles[G.map+':'+nx+','+ny]=true;
   this.burst(nx,ny);
   SFX.play('mine');
   G.toast('⛏️ Mined letters: '+word.split('').join(' ')+' (+2 coins)');
   G.updateHUD();G.checkChapter();G.save();
   this.buildZone();
  });
 },
 burst(x,zz){
  for(let i=0;i<10;i++){
   const p=new THREE.Mesh(new THREE.BoxGeometry(0.13,0.13,0.13),this.mats.ore);
   p.position.set(x,1.25,zz);
   p.userData.vel=new THREE.Vector3((Math.random()-0.5)*0.13,Math.random()*0.15+0.05,(Math.random()-0.5)*0.13);
   p.userData.life=42;
   this.scene.add(p);this.particles.push(p);
  }
 },
 travel(ex){
  G.map=ex.to;G.px=ex.sx;G.py=ex.sy;
  this.pDisp={x:ex.sx,z:ex.sy};
  if(ex.to==='cave')G.flags.visitedCave=true;
  if(ex.to==='desert')G.flags.visitedDesert=true;
  if(ex.to==='citadel')G.flags.visitedCitadel=true;
  SFX.play('whoosh');G.updateHUD();G.checkChapter();G.save();
  this.buildZone();
 },
 interact(){
  if(DLG.open){DLG.next();return;}
  const m=this.mapData();
  const dx={left:-1,right:1,up:0,down:0}[G.facing],dy={left:0,right:0,up:-1,down:1}[G.facing];
  const fx=G.px+dx,fy=G.py+dy;
  const npc=(m.npcs||[]).find(n=>n.x===fx&&n.y===fy);
  if(npc){SFX.play('click');SCRIPTS[npc.script]();return;}
  const sign=(m.signs||[]).find(s=>s.x===fx&&s.y===fy);
  if(sign){DLG.show('SIGN',[sign.msg]);return;}
  const t=this.tileAt(fx,fy);
  if(t===6){G.party.forEach((p,i)=>{p.hp=G.monOf(i).maxHp;});SFX.play('fanfare');DLG.show('HEAL HOUSE',["Welcome! ... Ding-ding! ♥","Your whole team is healed. Come back any time!"]);G.save();return;}
  if(t===7){UI.openCraft();return;}
  if(t===16){
   if(!G.pages.length){DLG.show('LIBRARY',["The shelves are dim and half the books are blank...","Bring back the Lost Pages to light this place up again!"]);}
   else{DLG.show('LIBRARY',["The library glows a little brighter! Pages recovered: "+G.pages.length+"/5.","(You can re-read any recovered page from your BAG.)"]);}
   return;
  }
  if(t===5){DLG.show('HOUSE',["A cozy home. Someone is reading by the window."]);return;}
  if(t===10){this.mineAt(fx,fy);return;}
 },
 tap(e){
  if(!G.started||BATTLE.active||DLG.open||document.querySelector('.overlay.open')||document.getElementById('exModal').classList.contains('open'))return;
  const r=this.renderer.domElement.getBoundingClientRect();
  const nd=new THREE.Vector2(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
  const rc=new THREE.Raycaster();rc.setFromCamera(nd,this.camera);
  const hitsN=rc.intersectObjects(this.npcSprites);
  if(hitsN.length){const n=hitsN[0].object.userData.npc;if(Math.abs(n.x-G.px)+Math.abs(n.y-G.py)<=1.5){SFX.play('click');SCRIPTS[n.script]();}return;}
  const hits=rc.intersectObjects(this.zoneGroup.children,false);
  if(!hits.length)return;
  const p=hits[0].point;
  const tx=Math.round(p.x),tz=Math.round(p.z);
  const d=Math.abs(tx-G.px)+Math.abs(tz-G.py);
  if(this.tileAt(tx,tz)===10&&d<=1){this.mineAt(tx,tz);return;}
  if(d===1){
   const dir=tx>G.px?'right':tx<G.px?'left':tz>G.py?'down':'up';
   this.tryMove(dir);
  }
 },

 // ---------- render loop ----------
 loop(){
  this.anim++;
  this.pDisp.x+=(G.px-this.pDisp.x)*0.22;
  this.pDisp.z+=(G.py-this.pDisp.z)*0.22;
  // player billboard
  const bobP=Math.abs(Math.sin(this.anim/8))*(this.moving?0.1:0.03);
  this.playerSprite.material=this.sprMats['rio_'+G.facing]||this.sprMats.rio_down;
  this.playerSprite.position.set(this.pDisp.x,1.12+bobP,this.pDisp.z);
  // partner mon follows behind
  const am=G.party.length?G.activeMon():null;
  if(am){
   if(this.partnerKey!==am.name){this.partnerKey=am.name;this.partnerSprite.material=this.svgMat(am.svg);}
   const off={down:{x:0,z:-1},up:{x:0,z:1},left:{x:1,z:0},right:{x:-1,z:0}}[G.facing];
   const tx=this.pDisp.x+off.x*0.95,tz=this.pDisp.z+off.z*0.95;
   this.partnerSprite.position.x+=(tx-this.partnerSprite.position.x)*0.12;
   this.partnerSprite.position.z+=(tz-this.partnerSprite.position.z)*0.12;
   this.partnerSprite.position.y=1.0+Math.sin(this.anim/9)*0.06;
   this.partnerSprite.visible=true;
  }else this.partnerSprite.visible=false;
  // hint bob + ore sparkle pulse
  if(this.zoneGroup)this.zoneGroup.children.forEach(o=>{
   if(o.userData.hint)o.position.y=o.userData.baseY+Math.sin(this.anim/9)*0.09;
   if(o.userData.spark)o.material.opacity=0.45+Math.abs(Math.sin(this.anim/14))*0.55;
  });
  // water shimmer
  if(this.mats.water&&this.mats.water.map)this.mats.water.map.offset.x=Math.sin(this.anim/70)*0.06;
  // lamp light follows Río in dark zones
  this.caveLight.position.set(this.pDisp.x,2.3,this.pDisp.z+0.4);
  // mining particles
  for(let i=this.particles.length-1;i>=0;i--){
   const p=this.particles[i];
   p.position.add(p.userData.vel);
   p.userData.vel.y-=0.008;
   p.rotation.x+=0.2;p.rotation.y+=0.13;
   if(--p.userData.life<=0){this.scene.remove(p);this.particles.splice(i,1);}
  }
  // chase camera — Minecraft diorama angle
  this.camera.position.lerp(new THREE.Vector3(this.pDisp.x,7.4,this.pDisp.z+6.2),0.12);
  this.camera.lookAt(this.pDisp.x,0.6,this.pDisp.z-0.6);
  this.renderer.render(this.scene,this.camera);
  requestAnimationFrame(()=>this.loop());
 }};

// GO!
WORLD.init();
G.updateHUD();
</script>
